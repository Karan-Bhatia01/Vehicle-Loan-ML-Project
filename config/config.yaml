data:
  raw_path: dataset/train.csv

features:
  target_col: loan_default
  drop_from_features: [loan_default, asset_cost, loan_id]
  cat_cols: [branch_id, supplier_id, manufacturer_id, pincode_id, state_id, employee_id]
  skewed_cols: [disbursed_amount, total_current_balance, total_sanctioned_amount]
  cols_to_drop:
    - downpayment_ratio
    - pri_account_count
    - pri_active_accounts
    - pri_overdue_accounts
    - pri_current_balance
    - pri_sanctioned_amount
    - pri_disbursed_amount
    - pri_installment_amount
    - has_credit_history
    - has_passport
    - has_driving_license
    - credit_hunger_delta
    - has_voter_id
  monotonic_constraints:
    ltv: 1
    bureau_score: -1
    total_active_accounts: -1
    overdue_ratio: 1
    credit_utilization: 1
    age_at_disbursal: -1
    inquiry_count: 1

encoder:
  smoothing: 10
  min_samples_leaf: 20

weights:
  clip_min: 0.5
  clip_max: 3.0

training:
  cv_folds: 5
  calibration_split: 0.20
  random_state: 42

tuning:
  n_iter: 30
  cv_folds: 3
  scoring: average_precision

output:
  models_dir: models
  charts_dir: charts
  pickle_name: loan_default_pipeline.pkl

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: vehicle-loan-default
